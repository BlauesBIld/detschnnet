name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Upload deploy script
      run: scp -o StrictHostKeyChecking=no deploy-script.sh detschn@detschn.net:/home/detschn/website/deploy-script.sh

    - name: Deploy to server
      run: |
        ssh -o StrictHostKeyChecking=no detschn@detschn.net 'bash ~/website/deploy-script.sh'
